name: Check Closed Internship Links

on:
  schedule:
    - cron: "0 12 * * *" # daily 12:00 UTC
  workflow_dispatch:

# <-- give the job permission to push & open PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false # let the PR action supply its own token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run checker
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/check_closed_jobs.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-report.md

      - name: Create Pull Request (only if files changed)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Mark closed postings as Closed🔒"
          title: "Closed internship links"
          body: "This PR replaces Apply buttons with **Closed🔒** for dead/filled or closed internship postings."
          branch: "auto/update-closed-links"
          add-paths: |
            README.md
            README-2026.md
